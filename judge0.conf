# Judge0 CE configuration (consumed by judge0-server and judge0-workers).
# Keep these values in sync with docker-compose.yml.

POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0

REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0

# Execution limits (the backend also sends per-problem limits per submission).
MAX_CPU_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=20
MAX_MEMORY_LIMIT=512000
MAX_PROCESSES_AND_OR_THREADS=60
ENABLE_NETWORK=false

# Local dev only: no auth token on the Judge0 API.
AUTHN_HEADER=X-Auth-Token
AUTHZ_HEADER=X-Auth-User
